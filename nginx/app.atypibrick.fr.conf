# Configuration Nginx de référence pour l'application Atypibrick.
#
# Source versionnée : /var/www/atypibrick_webapp/nginx/app.atypibrick.fr.conf
# Installation      : /etc/nginx/sites-available/app.atypibrick.fr
# Activation        : /etc/nginx/sites-enabled/app.atypibrick.fr

upstream atypibrick_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Le trafic HTTP est toujours redirigé vers HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name app.atypibrick.fr;

    return 301 https://app.atypibrick.fr$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.atypibrick.fr;

    root /var/www/atypibrick_webapp/dist;
    index index.html;

    access_log /var/log/nginx/atypibrick-access.log;
    error_log /var/log/nginx/atypibrick-error.log;

    ssl_certificate /etc/letsencrypt/live/app.atypibrick.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.atypibrick.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ATYPIBRICK_SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain;

    # Backend FastAPI commun. Le chemin /api/... est transmis sans réécriture.
    location /api/ {
        proxy_pass http://atypibrick_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;

        add_header Cache-Control "no-store" always;
    }

    # Images compressées produites par le backend Atypibrick.
    location /media/ {
        alias /var/www/common/backend/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Les fichiers Vite portent un hash dans leur nom et peuvent être conservés longtemps.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html ne doit pas être mis en cache afin de détecter les nouveaux builds.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Fallback nécessaire au routage côté client de l'application React.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
